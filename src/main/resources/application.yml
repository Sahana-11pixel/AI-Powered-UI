server:
  port: ${PORT:8080}


spring:
  application:
    name: ui-codegen-backend
  data:
    mongodb:
      uri: ${MONGO_URI:mongodb://localhost:27017}
      database: ${DB_NAME:ui_codegen}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# JWT Config
jwt:
  secret: ${JWT_SECRET}
  expiration-hours: 168   # 7 days

# Gemini AI
gemini:
  api-key: ${GEMINI_API_KEY}
  base-url: https://generativelanguage.googleapis.com/v1beta/models
  model: gemini-3.5-flash

# Firebase (path to service account JSON file)
firebase:
  credentials-file: ${FIREBASE_CREDENTIALS_FILE:firebase-service-account.json}

# Cloudinary
cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME}
  api-key: ${CLOUDINARY_API_KEY}
  api-secret: ${CLOUDINARY_API_SECRET}

# Unsplash (optional)
unsplash:
  access-key: ${UNSPLASH_ACCESS_KEY:}

# SpringDoc / Swagger
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

logging:
  level:
    com.uicodegen: INFO
    org.springframework.security: WARN
