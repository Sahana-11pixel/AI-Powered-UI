version: "3.9"

services:
  app:
    build: .
    container_name: ui-codegen-java
    ports:
      - "8080:8080"
    environment:
      MONGO_URI:              ${MONGO_URI}
      DB_NAME:                ${DB_NAME:-ui_codegen}
      JWT_SECRET:             ${JWT_SECRET}
      GEMINI_API_KEY:         ${GEMINI_API_KEY}
      FIREBASE_CREDENTIALS:   ${FIREBASE_CREDENTIALS}
      CLOUDINARY_CLOUD_NAME:  ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY:     ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET:  ${CLOUDINARY_API_SECRET}
    depends_on:
      - mongo
    restart: unless-stopped
    networks:
      - backend-net

  mongo:
    image: mongo:7
    container_name: ui-codegen-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped
    networks:
      - backend-net

volumes:
  mongo-data:

networks:
  backend-net:
    driver: bridge
